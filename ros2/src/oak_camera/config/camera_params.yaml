# OAK Camera Annotation Node Parameters

oak_camera_node:
  ros__parameters:
    # Local inference (CPU via OpenCV DNN). Requires local model files.
    use_local_inference: false
    local_model_path: "/home/chei/Desktop/sandhacks/ros2/src/oak_camera/models/mobilenet_ssd.caffemodel"
    local_config_path: "/home/chei/Desktop/sandhacks/ros2/src/oak_camera/models/mobilenet_ssd.prototxt"
    local_labels_path: "/home/chei/Desktop/sandhacks/ros2/src/oak_camera/models/mobilenet_ssd.labels"
    local_input_width: 300
    local_input_height: 300
    local_conf_threshold: 0.5
    local_scale: 0.007843
    local_mean: [127.5, 127.5, 127.5]
    local_swap_rb: false

    # Disable filtering to allow all detections through.
    enable_class_filter: false
    # Filter detections by class id or label name (case-insensitive).
    # Empty list publishes all detections.
    target_classes: []
